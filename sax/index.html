<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SaxChord — サックスのコード＆運指クイズ</title>
<meta name="description" content="コードの構成音をクイズ形式で覚え、サックスの運指図で確認し、実際に吹いた音をマイクで判定する練習アプリ">
<meta name="theme-color" content="#B8860B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="brand" data-nav="home" type="button" aria-label="ホームへ">
      <span class="brand-mark" aria-hidden="true">♭♯</span>
      <span class="brand-name">SaxChord</span>
    </button>
    <div class="topbar-right">
      <span class="inst-badge" id="inst-badge">Alto (E♭)</span>
      <button class="icon-btn" data-nav="settings" type="button" title="設定" aria-label="設定">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ ホーム ============ -->
  <section id="screen-home" class="screen active">
    <div class="hero">
      <h1 class="hero-title">コードを、指で覚える。</h1>
      <p class="hero-sub">クイズ → 答え合わせ → 運指図 → 実際に吹いてマイク判定。<br>移調（E♭/B♭管）は自動で処理します。</p>
    </div>

    <div class="mode-grid">
      <button class="mode-card" data-mode="tones" type="button">
        <span class="mode-icon" aria-hidden="true">♬</span>
        <span class="mode-body">
          <span class="mode-name">コード → 構成音</span>
          <span class="mode-desc">コード名を見て、構成音をすべて選ぶ</span>
        </span>
      </button>
      <button class="mode-card" data-mode="degree" type="button">
        <span class="mode-icon" aria-hidden="true">3rd</span>
        <span class="mode-body">
          <span class="mode-name">度数クイズ</span>
          <span class="mode-desc">「B♭7 の ♭7 は？」を瞬時に答える</span>
        </span>
      </button>
      <button class="mode-card" data-mode="name" type="button">
        <span class="mode-icon" aria-hidden="true">?</span>
        <span class="mode-body">
          <span class="mode-name">構成音 → コード名</span>
          <span class="mode-desc">並んだ音から、コード名を当てる</span>
        </span>
      </button>
      <button class="mode-card" data-mode="fingering" type="button">
        <span class="mode-icon" aria-hidden="true">✋</span>
        <span class="mode-body">
          <span class="mode-name">運指クイズ</span>
          <span class="mode-desc">運指図を見て、音名を答える</span>
        </span>
      </button>
      <button class="mode-card mode-card-mic" data-mode="play" type="button">
        <span class="mode-icon" aria-hidden="true">🎤</span>
        <span class="mode-body">
          <span class="mode-name">吹いて答える</span>
          <span class="mode-desc">コードトーンを実際に吹く。マイクで正誤判定</span>
        </span>
      </button>
    </div>

    <div class="home-links">
      <button class="link-card" data-nav="chart" type="button">
        <span>運指表を見る</span><span class="chev" aria-hidden="true">›</span>
      </button>
      <button class="link-card" data-nav="tuner" type="button">
        <span>チューナー / 音当て（マイク）</span><span class="chev" aria-hidden="true">›</span>
      </button>
      <button class="link-card" data-nav="stats" type="button">
        <span>成績と苦手コード</span><span class="chev" aria-hidden="true">›</span>
      </button>
    </div>

    <p class="home-note" id="home-note"></p>
  </section>

  <!-- ============ クイズ ============ -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-head">
      <button class="back-btn" data-nav="home" type="button">‹ ホーム</button>
      <div class="score-line">
        <span id="score-text">0 / 0</span>
        <span class="streak" id="streak-text"></span>
      </div>
    </div>
    <div class="quiz-body" id="quiz-body"></div>
  </section>

  <!-- ============ 吹いて答える ============ -->
  <section id="screen-play" class="screen">
    <div class="quiz-head">
      <button class="back-btn" data-nav="home" type="button">‹ ホーム</button>
      <div class="score-line"><span id="play-score-text">0 / 0</span></div>
    </div>
    <div class="quiz-body" id="play-body"></div>
  </section>

  <!-- ============ 運指表 ============ -->
  <section id="screen-chart" class="screen">
    <div class="quiz-head">
      <button class="back-btn" data-nav="home" type="button">‹ ホーム</button>
      <h2 class="screen-title">運指表</h2>
    </div>
    <div class="chart-wrap" id="chart-wrap"></div>
  </section>

  <!-- ============ チューナー ============ -->
  <section id="screen-tuner" class="screen">
    <div class="quiz-head">
      <button class="back-btn" data-nav="home" type="button">‹ ホーム</button>
      <h2 class="screen-title">チューナー / 音当て</h2>
    </div>
    <div class="tuner-wrap" id="tuner-wrap"></div>
  </section>

  <!-- ============ 成績 ============ -->
  <section id="screen-stats" class="screen">
    <div class="quiz-head">
      <button class="back-btn" data-nav="home" type="button">‹ ホーム</button>
      <h2 class="screen-title">成績</h2>
    </div>
    <div class="stats-wrap" id="stats-wrap"></div>
  </section>

  <!-- ============ 設定 ============ -->
  <section id="screen-settings" class="screen">
    <div class="quiz-head">
      <button class="back-btn" data-nav="home" type="button">‹ ホーム</button>
      <h2 class="screen-title">設定</h2>
    </div>
    <div class="settings-wrap" id="settings-wrap"></div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
