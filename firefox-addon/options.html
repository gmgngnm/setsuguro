<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>選んで訳す — 設定</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main class="wrap">
  <header class="head">
    <img class="logo" src="icons/icon.svg" width="40" height="40" alt="">
    <div>
      <h1>選んで訳す</h1>
      <p class="lead">ページの英文をマウスで選ぶと、その場に日本語訳が出ます。</p>
    </div>
  </header>

  <section class="card">
    <h2>Gemini のAPIキー</h2>
    <p class="help">
      訳は Google の Gemini に頼みます。キーは
      <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">Google AI Studio</a>
      で作れます。キーはこの端末の中だけに保存され、Gemini 以外には送りません。
    </p>
    <div class="row">
      <input id="api-key" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false">
      <button id="peek" class="ghost" type="button">表示</button>
    </div>
  </section>

  <section class="card">
    <h2>モデル</h2>
    <p class="help">迷ったらそのままで構いません。キーを入れると、使えるモデルが候補に出ます。</p>
    <input id="model" list="model-list" spellcheck="false" autocomplete="off">
    <datalist id="model-list"></datalist>
  </section>

  <section class="card">
    <h2>訳すきっかけ</h2>
    <label class="choice">
      <input type="radio" name="trigger" value="auto">
      <span><b>選んだらすぐ訳す</b><small>手数は要らないが、選び直すたびに Gemini を呼ぶ</small></span>
    </label>
    <label class="choice">
      <input type="radio" name="trigger" value="button">
      <span><b>「訳す」を押したときだけ訳す</b><small>選んでも勝手には呼ばない</small></span>
    </label>
  </section>

  <section class="card">
    <h2>動作</h2>
    <label class="choice">
      <input type="checkbox" id="enabled">
      <span><b>拡張機能を動かす</b><small>ツールバーの釦でも入切できる（止めていると「切」と出る）</small></span>
    </label>
  </section>

  <section class="card">
    <h2>試してみる</h2>
    <p class="help">いま入っている設定のまま、短い英文を一つ訳します。</p>
    <button id="test" class="primary" type="button">試す</button>
    <p id="test-result" class="result"></p>
  </section>

  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>
<script src="common.js"></script>
<script src="options.js"></script>
</body>
</html>
