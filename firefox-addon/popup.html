<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>選んで訳す</title>
<link rel="stylesheet" href="options.css">
</head>
<body class="popup">
<header class="pop-head">
  <img src="icons/icon.svg" width="26" height="26" alt="">
  <b>選んで訳す</b>
  <span class="ver" id="version"></span>
  <label class="pop-switch">
    <input type="checkbox" id="enabled">
    <span>動かす</span>
  </label>
</header>

<label class="pop-label" for="engine">翻訳に使うもの</label>
<select id="engine"></select>

<label class="pop-label" id="key-label" for="key-input">APIキー</label>
<div class="row">
  <input id="key-input" type="password" autocomplete="off" spellcheck="false">
  <button id="peek" class="ghost" type="button">表示</button>
</div>
<p id="key-note" class="help" role="status" aria-live="polite"></p>

<button id="more" class="ghost wide" type="button">くわしい設定</button>

<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
