<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>選んで訳す</title>
<link rel="stylesheet" href="options.css">
</head>
<body class="popup">
<div class="pop-head">
  <label class="pop-switch"><input type="checkbox" id="enabled"> 動かす</label>
  <h1>選んで訳す <span class="ver" id="version"></span></h1>
</div>

<label class="pop-check"><input type="checkbox" id="hover"> カーソルを1秒あわせて意味を出す</label>

<label class="pop-label" for="engine">翻訳に使うもの</label>
<select id="engine"></select>

<label class="pop-label" id="key-label" for="key-input">APIキー</label>
<input id="key-input" type="password" autocomplete="off" spellcheck="false">
<button id="peek" type="button">表示</button>
<span id="key-note" class="note" role="status" aria-live="polite"></span>

<button id="more" class="wide" type="button">くわしい設定</button>

<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
