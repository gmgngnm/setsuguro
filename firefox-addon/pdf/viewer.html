<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Cursor Translator — PDF</title>
<link rel="stylesheet" href="../options.css">
<link rel="stylesheet" href="vendor/pdf_viewer.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body class="pdfpage">
<div class="pdfbar">
  <b>Cursor Translator</b>
  <button id="open" type="button">PDFを開く</button>
  <input type="file" id="file" accept="application/pdf,.pdf" hidden>
  <span id="name" class="pdfname"></span>
  <span class="pdfzoom">
    <button id="out" type="button" title="小さく">−</button>
    <b id="scale" class="val">—</b>
    <button id="in" type="button" title="大きく">＋</button>
  </span>
  <span id="pages" class="val"></span>
</div>
<p id="note" class="pdfnote"></p>

<div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div>

<script src="../common.js"></script>
<script src="viewer.js" type="module"></script>
<script src="../content.js"></script>
</body>
</html>
